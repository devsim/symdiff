[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symdiff"
version = "1.3.3"
description = "SYMDIFF: Symbolic differentation of algebraic expressions"
authors = [{ name = "DEVSIM LLC", email = "info@devsim.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dynamic = ["readme"]

[project.urls]
Homepage = "https://symdiff.org"
"Bug Tracker" = "https://github.com/devsim/symdiff/issues"
"Source Code" = "https://github.com/devsim/symdiff"
"Online Forum" = "https://forum.devsim.org"

[tool.setuptools]
packages = ["symdiff"]

[tool.setuptools.package-data]
symdiff = ["*.so", "*.pyd"]
